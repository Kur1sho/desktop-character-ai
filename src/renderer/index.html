<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self' blob: data: https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdn.jsdelivr.net"
    />
    <title>Desktop Companion</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      canvas { display: block; }
      #chat {
        position: absolute; left: 0; top: 0; width: 280px;
        transform: translate(-50%, -100%);
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        font: 15px/1.35 'Segoe UI', system-ui, sans-serif;
        pointer-events: auto;
      }
      #bubble {
        position: relative; max-width: 280px; padding: 10px 14px; border-radius: 16px;
        background: #ffffff; color: #1d2430; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        opacity: 0; transform: translateY(6px) scale(0.96); transition: opacity 0.18s, transform 0.18s;
        white-space: pre-wrap; word-wrap: break-word;
      }
      #bubble.show { opacity: 1; transform: none; }
      #bubble.error { background: #fff1f0; color: #9b1c1c; }
      #bubble::after {
        content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px;
        border: 8px solid transparent; border-top-color: inherit; border-bottom: 0;
        border-top-color: #ffffff;
      }
      #bubble.error::after { border-top-color: #fff1f0; }
      #bubble .dots span { animation: blink 1.2s infinite; }
      #bubble .dots span:nth-child(2) { animation-delay: 0.2s; }
      #bubble .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
      #bubble .choices { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }
      #bubble .choices button {
        font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 0; cursor: pointer;
        background: #e8edf3; color: #1d2430;
      }
      #bubble .choices button.yes { background: #1fb8b5; color: #fff; }
      #bubble .choices button:hover { filter: brightness(0.95); }
      #input {
        display: none; width: 240px; padding: 8px 12px; border-radius: 999px; border: 2px solid #1fb8b5;
        background: rgba(255, 255, 255, 0.97); color: #1d2430; font: inherit; outline: none;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }
      #input.show { display: block; }
      #friendBubble {
        position: absolute; left: 0; top: 0; max-width: 240px; padding: 9px 13px; border-radius: 16px;
        background: #fff4f8; color: #1d2430; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        font: 15px/1.35 'Segoe UI', system-ui, sans-serif; white-space: pre-wrap; word-wrap: break-word;
        transform: translate(-50%, -100%) translateY(6px) scale(0.96); opacity: 0; pointer-events: none;
        transition: opacity 0.18s, transform 0.18s;
      }
      #friendBubble.show { opacity: 1; transform: translate(-50%, -100%); }
      #friendBubble::after {
        content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px;
        border: 8px solid transparent; border-bottom: 0; border-top-color: #fff4f8;
      }
      #alertBubble {
        position: absolute; left: 0; top: 0; max-width: 240px; padding: 10px 14px; border-radius: 16px;
        background: #fff; color: #9b1c1c; font: 700 17px/1.3 'Segoe UI', system-ui, sans-serif;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); border: 2px solid #d0191b;
        transform: translate(-100%, -50%) scale(0.9); opacity: 0; transition: opacity 0.18s, transform 0.18s; cursor: pointer;
      }
      #alertBubble.show { opacity: 1; transform: translate(-100%, -50%); }
      #alertBubble::after {
        content: ''; position: absolute; right: -10px; top: 50%; margin-top: -8px;
        border: 8px solid transparent; border-right: 0; border-left: 10px solid #d0191b;
      }
    </style>
  </head>
  <body>
    <div id="chat">
      <div id="bubble"></div>
      <input id="input" type="text" maxlength="2000" placeholder="Say something… (Enter to send, Esc to close)" />
    </div>
    <div id="friendBubble"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
